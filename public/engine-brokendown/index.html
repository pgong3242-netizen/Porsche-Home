<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>发动机拆解台 · Porsche Home</title>
<!--
  发动机拆解台 — V8 径向机械爆炸图（Porsche-Home 抽卡彩蛋页）
  视觉对齐 Porsche-Home 车库：鼠尾草灰绿无缝背景 + 柔和棚光 + 站点式控件与微标签
  （色板 / 控件 token 取自 Porsche-Home/app/globals.css：--ink #263b32、body #d9dfcd、
    .explode-value Georgia #899576、.explode-slider-row 绿轨 #71856a/#dce1d2 与 #fffdf5 白钮）
  程序化工业造型示意，非制造商 CAD 或维修装配数据。
  参考：Porsche-Home/examples/231.png（白底 · 银黑金属 · 径向机械爆炸图）
  零构建：双击本文件即可（three.js 已随包放在 ./vendor，离线可用）
  URL 参数：?t=1 固定展开度 · ?auto=0 停自动 · ?spin=0 停自转 · ?quality=low 低配
            ?dpr=1 像素比 · ?ao=0 关环境光遮蔽 · ?bloom=0 关泛光 · ?roll=0.2 整机倾倒
            ?explode=0.7 爆炸距离系数 · ?debug=1 显示读数
-->
<style>
  /* ── 色板 / 材质：照搬 Porsche-Home（app/globals.css 的 :root 与车库画布） ── */
  :root{
    --ink:#263b32;            /* 站内主文字 */
    --ink-soft:#647064;
    --muted:#919580;          /* eyebrow 微标签 */
    --line:rgba(54,70,53,.15);
    --accent:#9b694a;         /* 站点暖棕：标题前的小横线 */
    --green:#71856a;          /* 滑块进度 / 主控件绿 */
    --track:#dce1d2;          /* 滑块轨道 */
    --value:#899576;          /* Georgia 数值 */
    --card:rgba(248,248,237,.9);
    --card-line:rgba(255,255,248,.78);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden;
    background:radial-gradient(118% 94% at 50% 24%, #dfe4d3 0%, #d3d9c6 46%, #c3cab5 100%);
    font:400 13px/1.5 "Inter","Aptos","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #stage:active{ cursor:grabbing; }

  /* 角落微标签 / 站内衬线标题：同站点 .scene-number、.scene-intro */
  .eyebrow{ font-size:8px; letter-spacing:1.8px; text-transform:uppercase; color:var(--muted); }
  #meta{ position:fixed; left:38px; top:30px; pointer-events:none; }
  #meta h1{ margin:8px 0 0; font-family:"Songti SC","Noto Serif CJK SC","STSong","SimSun",Georgia,serif;
    font-size:22px; font-weight:400; letter-spacing:1px; color:var(--ink); }
  #meta h1::before{ content:""; display:inline-block; width:14px; height:1px; margin-right:8px;
    vertical-align:middle; background:var(--accent); }
  #corner{ position:fixed; left:38px; bottom:28px; pointer-events:none; }

  /* 控件卡：照抄站点 .workshop-controls 的暖纸材质（1px 白边 / 8px 圆角 / 柔绿投影）
     数值用站点 .explode-value 的 Georgia 字体，滑块用站点 .explode-slider-row 的绿轨 */
  #hud{ position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    width:min(430px,calc(100% - 40px)); padding:15px 20px 11px;
    background:var(--card); border:1px solid var(--card-line); border-radius:8px;
    backdrop-filter:blur(20px); box-shadow:0 8px 35px rgba(34,47,29,.06);
    opacity:0; pointer-events:none; transition:opacity .5s ease; }
  #hud.show,#hud:focus-within{ opacity:1; pointer-events:auto; }
  #hud .head{ display:flex; align-items:flex-start; justify-content:space-between; gap:15px; }
  #value{ font-family:Georgia,serif; font-size:27px; line-height:1; font-weight:400; color:var(--value); }
  #value small{ font-size:11px; margin-left:2px; }
  #controls{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  #track{ position:relative; flex:1; height:16px; display:flex; align-items:center; }
  /* 轨道 / 圆钮照抄站点 .explode-slider-row：绿轨 #71856a、轨道灰 #dce1d2、白钮 + 3px 绿边 */
  #slider{ appearance:none; -webkit-appearance:none; width:100%; height:16px; margin:0; background:transparent; cursor:pointer; }
  #slider::-webkit-slider-runnable-track{ height:3px; border-radius:2px;
    background:linear-gradient(to right,var(--green) 0%,var(--green) var(--p,0%),var(--track) var(--p,0%),var(--track) 100%); }
  #slider::-webkit-slider-thumb{ appearance:none; width:12px; height:12px; margin-top:-4.5px; border-radius:50%;
    background:#fffdf5; border:3px solid #75876a; box-shadow:0 1px 5px #71856a44; }
  #slider::-moz-range-track{ height:3px; border-radius:2px;
    background:linear-gradient(to right,var(--green) 0%,var(--green) var(--p,0%),var(--track) var(--p,0%),var(--track) 100%); }
  #slider::-moz-range-thumb{ width:9px; height:9px; border-radius:50%; background:#fffdf5; border:3px solid #75876a; }
  .captions{ display:flex; justify-content:space-between; font-size:8px; letter-spacing:.6px; color:#929a83; margin-top:3px; }
  .btn{ display:flex; align-items:center; gap:5px; flex:0 0 auto; padding:5px 9px; font:inherit; font-size:10px;
    letter-spacing:.4px; background:none; border:1px solid #e0e3d6; border-radius:3px; color:#8a967c;
    cursor:pointer; transition:background .2s,color .2s,border-color .2s; }
  .btn:hover{ background:#eef1e5; color:#5a7151; border-color:#c9d2bb; }
  .btn[data-on="0"]{ color:#a8af9b; }
  .btn svg{ width:11px; height:11px; display:block; }

  #boot{ position:fixed; inset:0; display:grid; place-items:center; transition:opacity .7s ease; }
  #boot.gone{ opacity:0; pointer-events:none; }
  #boot span{ display:block; width:34px; height:2px; border-radius:2px; background:var(--track); overflow:hidden; }
  #boot span::after{ content:""; display:block; width:40%; height:100%; background:var(--green);
    animation:run 1.1s cubic-bezier(.6,.1,.3,.9) infinite; }
  @keyframes run{ 0%{ transform:translateX(-110%); } 100%{ transform:translateX(260%); } }
  #note{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%); max-width:min(90vw,520px);
    display:none; text-align:center; font-size:11px; color:#8a967c; }
  #dbg{ position:fixed; left:12px; top:10px; display:none; font:11px/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--ink-soft); opacity:.85; }

  #part-marker[hidden],#part-leader[hidden]{display:none}
  #part-notes{position:fixed;right:30px;top:30px;width:260px;padding:20px;background:rgba(248,248,237,.94);border:1px solid var(--card-line);border-top:2px solid var(--accent);border-radius:4px;box-shadow:0 12px 36px #263b3210;z-index:2}
  .notes-top{display:flex;justify-content:space-between;align-items:center;font:9px/1.4 ui-monospace,monospace;letter-spacing:1.3px;color:var(--ink-soft)}
  .notes-top i{width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 4px #9b694a15}
  #part-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:18px 0}
  #part-menu button{padding:8px 2px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);font:inherit;font-size:11px;cursor:pointer;border-radius:2px}
  #part-menu button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#f8f8ed}
  #part-menu button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #part-code{font:10px/1.6 ui-monospace,monospace;letter-spacing:1.3px;color:var(--accent)}
  #part-title{font-size:24px;font-weight:500;letter-spacing:2px;margin:7px 0 3px}
  #part-tagline{font-size:12px;color:var(--ink-soft);margin:0 0 14px}
  #part-description{font-size:12px;line-height:1.9;margin:0;min-height:92px}
  .part-footer{margin-top:16px;padding-top:10px;border-top:1px solid var(--line);font:9px/1.5 ui-monospace,monospace;letter-spacing:1px;color:var(--ink-soft)}
  #part-marker{position:fixed;left:0;top:0;pointer-events:none;z-index:1;padding:5px 9px 5px 19px;border:1px solid #9b694a70;background:#f8f8edee;font:10px/1.5 ui-monospace,"PingFang SC",sans-serif;letter-spacing:1px;white-space:nowrap;box-shadow:0 3px 12px #263b3210}
  #part-marker::before{content:"";position:absolute;width:5px;height:5px;left:7px;top:10px;border:1px solid var(--accent);border-radius:50%}
  #part-leader{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
  #part-leader path{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 5;opacity:.6}
  #part-leader circle{fill:#f8f8ed;stroke:var(--accent);stroke-width:1.5}
  @media(max-width:700px){
    #meta{left:18px;top:18px}#meta h1{font-size:18px}#corner{display:none}
    #part-notes{top:auto;bottom:132px;left:14px;right:14px;width:auto;padding:12px 14px}
    #part-menu{display:flex;gap:4px;margin:10px 0}#part-menu button{flex:1;padding:7px 2px;font-size:10px}
    #part-title{font-size:19px;margin:4px 0}#part-tagline{margin:0 0 5px;font-size:11px}
    #part-description{min-height:0;font-size:11px;line-height:1.65}.part-footer{display:none}
    #part-code{font-size:9px}#hud{bottom:16px;padding:12px 14px}
    #part-marker{font-size:9px}#part-leader{display:none}
  }
  @media(max-height:600px){#part-notes{top:14px;bottom:auto;left:auto;right:14px;width:235px;max-height:calc(100dvh - 28px);overflow:auto}#part-description{min-height:0}.part-footer{display:none}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div id="meta">
  <div class="eyebrow">Engine · Exploded View</div>
  <h1>发动机 · 逐件拆解</h1>
</div>
<div id="corner"><span class="eyebrow">Egg / Exploded View</span></div>

<div id="hud">
  <div class="head">
    <div class="eyebrow">拆解进度</div>
    <div id="value"><span id="valueNum">0</span><small>%</small></div>
  </div>
  <div id="controls">
    <button class="btn" id="btnPlay" title="自动展开 / 暂停" aria-label="自动展开">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path id="icoPlay" d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
      <span id="lblPlay">自动拆解</span>
    </button>
    <div id="track"><input id="slider" type="range" min="0" max="1000" value="0" aria-label="展开进度"></div>
    <button class="btn" id="btnSpin" title="自转" aria-label="自转">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
      <span>自转</span>
    </button>
  </div>
  <div class="captions"><span>整机</span><span>逐件拆开</span></div>
</div>


<svg id="part-leader" aria-hidden="true" hidden><path/><circle r="4"/></svg>
<div id="part-marker" aria-hidden="true" hidden></div>
<aside id="part-notes" aria-label="发动机零件档案">
  <div class="notes-top"><span>MECHANICAL ANATOMY / V8</span><i aria-hidden="true"></i></div>
  <nav id="part-menu" aria-label="选择零件"></nav>
  <div aria-live="polite" aria-atomic="true">
    <div id="part-code"></div><h2 id="part-title"></h2>
    <p id="part-tagline"></p><p id="part-description"></p>
  </div>
  <div class="part-footer">选择零件 · 跟随拆解探索<br>V8 结构示意 / COMPONENT STUDY</div>
</aside>

<div id="boot"><span></span></div>
<div id="note"></div>
<div id="dbg"></div>

<script>
  // three.js 载入失败（离线 / 路径不对）时的兜底提示
  setTimeout(function(){
    if(!window.__studioReady){
      var n = document.getElementById('note');
      n.style.display = 'block';
      n.textContent = '未能载入 three.js。请确认 ./vendor/three/ 与本文件同级存在。';
    }
  }, 9000);
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// 顶层错误探针：模块内任何异常都留痕（页面里用 window.__err 读，便于无头环境定位）
addEventListener('error', e => {
  window.__err = (e.message || String(e.error || '(empty)')) + ' @' + (e.lineno || '?') + ':' + (e.colno || '?')
    + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0, 4).join('\n') : '');
});
addEventListener('unhandledrejection', e => {
  window.__err = 'unhandledrejection: ' + (e.reason && e.reason.stack ? e.reason.stack.slice(0, 500) : String(e.reason));
});

/* ══════════════ 0. 参数 ══════════════ */
const P = new URLSearchParams(location.search);
const LOW = P.get('quality') === 'low';
const num = (k, d) => (P.get(k) === null ? d : parseFloat(P.get(k)));
const Q = {
  auto: P.get('auto') === '1',
  spin: P.get('spin') !== '0',              // 自转默认开（?spin=0 关闭）
  ao:   P.get('ao')   !== '0' && !LOW,
  bloom:P.get('bloom') === '1' && !LOW,
  debug:P.get('debug') === '1',
  bg:   P.get('bg') || 'studio',   // studio=engine.png 白棚高调 | gradient=engin.png 蓝粉渐变
  exp:  P.get('exp') === null ? null : parseFloat(P.get('exp')),
  t:    P.get('t') === null ? null : clamp(num('t', 0), 0, 1),
  roll: num('roll', -.12),            // 整机绕曲轴轴线的倾倒（对标参考图姿态）
  explode: num('explode', 1.0),      // 全局爆炸距离系数
  dpr:  clamp(num('dpr', LOW ? 1 : 1.75), .6, 2),
  fasteners: LOW ? .35 : .7,
  shadow: !LOW,
};
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
const smooth = t => t * t * (3 - 2 * t);
const X3 = new THREE.Vector3(1, 0, 0);
const EXP = Q.exp === null ? 1.0 : Q.exp;

/* ══════════════ 1. 相机 / 灯光 / 环境 ══════════════ */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.dpr);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = EXP;
renderer.shadowMap.enabled = Q.shadow;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;                   // 多通道渲染时统计要跨 pass 累加
renderer.setClearAlpha(0);                         // 背景交给 CSS 渐变

const scene = new THREE.Scene();

// 背景：默认就是 Porsche-Home 车库那块鼠尾草灰绿无缝背景（画进渲染器自身的背景，
// 保证任何截图/浏览器里都在）；?bg=gradient 保留冷蓝 → 暖粉的参考配色。
// 左上叠一层柔光灯箱（金属长条高光的来源），右下角一点暖色热晕
function backdrop(){
  const c = document.createElement('canvas'); c.width = 96; c.height = 512;
  const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 512);
  if (Q.bg === 'gradient'){
    // engin.png：顶部冷蓝 → 底部暖粉
    gr.addColorStop(0, '#a2c5da'); gr.addColorStop(.24, '#b4cad9'); gr.addColorStop(.5, '#c8d1d9');
    gr.addColorStop(.76, '#dccdc9'); gr.addColorStop(1, '#f0d1c3');
  } else {
    // 车库：鼠尾草灰绿无缝背景（顶部受光略亮，向地面略沉，与站点车库画布同族）
    gr.addColorStop(0, '#dfe4d3'); gr.addColorStop(.30, '#d8dec9'); gr.addColorStop(.62, '#cfd6c2');
    gr.addColorStop(.86, '#c8cfba'); gr.addColorStop(1, '#c0c7b3');
  }
  x.fillStyle = gr; x.fillRect(0, 0, 96, 512);
  // 左上灯箱：让金属有一条明确的柔光亮带（棚拍"长条高光"的来源）
  const lb = x.createRadialGradient(16, 132, 0, 16, 132, 330);
  lb.addColorStop(0, Q.bg === 'gradient' ? 'rgba(255,255,255,.38)' : 'rgba(255,255,255,.45)');
  lb.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = lb; x.fillRect(0, 0, 96, 512);
  // 右下暖色热晕：车库底色里压得很弱，只留一点温度
  const warm = Q.bg === 'gradient' ? .55 : .14;
  const hl = x.createRadialGradient(84, 452, 0, 84, 452, 300);
  hl.addColorStop(0, `rgba(255,168,96,${warm})`); hl.addColorStop(.45, `rgba(255,140,70,${warm * .33})`);
  hl.addColorStop(1, 'rgba(255,130,70,0)');
  x.fillStyle = hl; x.fillRect(0, 0, 96, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.toneMapped = false;                    // 渐变本身就是最终色，不再过色调映射
  return t;
}
scene.background = backdrop();          // 画布纹理 toneMapped=false，色值即所见
scene.backgroundIntensity = 1;

const camera = new THREE.PerspectiveCamera(19, innerWidth / innerHeight, .5, 300);   // 长焦，近正交观感
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;  controls.dampingFactor = .07;
controls.enablePan = false;     controls.rotateSpeed = .6;  controls.zoomSpeed = .7;
controls.minDistance = 5;       controls.maxDistance = 100;
controls.minPolarAngle = .55;   controls.maxPolarAngle = 2.05;

/**
 * 车库棚光（对齐 Porsche-Home 车库）：亮灰绿环境 + 几片大面积柔光灯箱。
 * 站点车库是均匀亮棚而非暗室 —— 亮环境让金属映到同一片灰绿上，
 * 暗部不再压成黑块；靠灯箱"宽/窄"的差别保留一长一短两条柔光高光。
 */
function showroomEnv(){
  const s = new THREE.Scene();
  s.background = new THREE.Color('#cfd5c3');
  const panel = (w, h, color, intensity, at) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.set(at[0], at[1], at[2]); m.lookAt(0, 0, 0); s.add(m); return m;
  };
  panel(10, 6, '#ffffff', 4.5, [-9, 8, 7]);     // 主灯箱（左上大面积柔光）
  panel(2.2, 12, '#ffffff', 6.5, [11, 1, 0]);   // 右侧窄条灯 → 金属上的细长高光条
  panel(12, 5, '#ffffff', 3.6, [-2, 7, -11]);   // 后方轮廓灯箱
  panel(12, 7, '#f4f2e3', 1.4, [1, -8, 3]);     // 底部反光板（车库地面的暖白反弹光）
  panel(20, 14, '#ffffff', 2.2, [0, 15, 0]);    // 顶部柔光（车库顶棚的漫射光）
  panel(18, 12, '#ffffff', 1.7, [-15, 0, 0]);   // 左侧反光墙：给形体第二亮面
  return s;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(showroomEnv(), .04).texture;
scene.environmentIntensity = 1;     // 亮棚：环境承担主要填充，方向光只补塑形

// 主光：冷白，左上偏前（车库顶灯方向）
const key = new THREE.DirectionalLight('#ffffff', 2.4);
key.position.set(6, 9, 5);
key.castShadow = Q.shadow;
key.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
key.shadow.radius = 2.4; key.shadow.bias = -.0005; key.shadow.normalBias = .025;
{ const c = key.shadow.camera; c.left = -6; c.right = 6; c.top = 6; c.bottom = -6; c.near = .5; c.far = 46; c.updateProjectionMatrix(); }
scene.add(key);
// 补光（车库照度均匀，暗面要提起来但不能填平）
const fill = new THREE.DirectionalLight('#ffffff', .65); fill.position.set(-7, 3, 6); scene.add(fill);
// 轮廓光（后方偏上：给金属棱边一条亮线，拉开零件）

  const value = 205 + (grainSeed >>> 26) * .75;
  grainData[i]=grainData[i+1]=grainData[i+2]=value; grainData[i+3]=255;
}

grain.wrapS=grain.wrapT=THREE.RepeatWrapping; grain.repeat.set(7,7);

const cache = new Map();

const V2 = (x, y) => new THREE.Vector2(x, y);
const lathe = (pts, seg = 44) => g('L' + JSON.stringify(pts) + seg, () => new THREE.LatheGeometry(pts.map(p => V2(p[0], p[1])), seg));
const cyl   = (r1, r2, h, seg = 24) => g(`C|${r1}|${r2}|${h}|${seg}`, () => new THREE.CylinderGeometry(r1, r2, h, seg));
const torus = (r, tube, seg = 12, arc = Math.PI * 2) => g(`T|${r}|${tube}|${seg}|${arc}`, () => new THREE.TorusGeometry(r, tube, Math.max(12,seg), 64, arc));
const box = (a, b, c) => g(`B|${a}|${b}|${c}`, () =>

// Open cylinder bores cut through the deck, with machined inner walls.
function deck(length, width, depth, radius){
  const shape = new THREE.Shape();
  const x=length/2, y=width/2, r=.075;
  shape.moveTo(-x+r,-y); shape.lineTo(x-r,-y); shape.quadraticCurveTo(x,-y,x,-y+r);
  shape.lineTo(x,y-r); shape.quadraticCurveTo(x,y,x-r,y);
  shape.lineTo(-x+r,y); shape.quadraticCurveTo(-x,y,-x,y-r);
  shape.lineTo(-x,-y+r); shape.quadraticCurveTo(-x,-y,-x+r,-y); shape.closePath();
  for(const x of [-1.125,-.375,.375,1.125]){
    const hole = new THREE.Path(); hole.absarc(x,0,radius,0,Math.PI*2,true); shape.holes.push(hole);
  }
  const geo = new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelSize:.018,bevelThickness:Math.min(.018,depth*.2),bevelSegments:4,curveSegments:32});
  geo.translate(0,0,-depth/2); geo.rotateX(-Math.PI/2); return geo;
}
const sph   = (r, s = 16) => g(`S|${r}|${s}`, () => new THREE.SphereGeometry(r, s, Math.max(8, s >> 1)));

/** 正齿轮（轴向 z） */
function gearGeo(teeth, rootR, tipR, thick, boreR = 0){
  return g(`G|${teeth}|${rootR}|${tipR}|${thick}|${boreR}`, () => {
    const s = new THREE.Shape(), n = teeth * 4;
    for (let i = 0; i <= n; i++){
      const a = i / n * Math.PI * 2, r = (i % 4 < 2 ? tipR : rootR);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? s.lineTo(x, y) : s.moveTo(x, y);
    }
    s.closePath();
    if (boreR > 0){ const h = new THREE.Path(); h.absarc(0, 0, boreR, 0, Math.PI * 2, true); s.holes.push(h); }
    const e = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: true, bevelSize: .005, bevelThickness: .005, bevelSegments: 1, curveSegments: 2 });
    e.translate(0, 0, -thick / 2); return e;
  });
}
/** 螺旋弹簧（轴向 y） */
function springGeo(coils, r, len, wire){
  return g(`SP|${coils}|${r}|${len}|${wire}`, () => {
    const pts = [], N = coils * 16;
    for (let i = 0; i <= N; i++){
      const t = i / N, a = t * coils * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * r, -len / 2 + t * len, Math.sin(a) * r));
    }
    return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), N, wire, 6, false);
  });
}
function tubeGeo(pts, r, seg = 40){
  return g('TB|' + JSON.stringify(pts) + r, () =>
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), seg, r, 16, false));
}
const mesh = (o, geometry, material, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x, y, z);
  if (Q.shadow) m.castShadow = m.receiveShadow = true;
  o.add(m); return m;
};
/** 圆角板（缸盖/前盖/气门室盖这类铸件）：圆角矩形挤出 */
function plate(w, h, t, r = .06){
  return g(`P|${w}|${h}|${t}|${r}`, () => {
    const s = new THREE.Shape();
    const x = w / 2 - r, y = h / 2 - r;
    s.moveTo(-x - r, -y); s.lineTo(-x - r, y); s.absarc(-x, y, r, Math.PI, Math.PI / 2, true);
    s.lineTo(x, y + r); s.absarc(x, y, r, Math.PI / 2, 0, true);
    s.lineTo(x + r, -y); s.absarc(x, -y, r, 0, -Math.PI / 2, true);
    s.lineTo(-x, -y - r); s.absarc(-x, -y, r, -Math.PI / 2, -Math.PI, true);
    s.closePath();
    const e = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: true, bevelSize: .025, bevelThickness: .025, bevelSegments: 4, curveSegments: 12 });
    e.translate(0, 0, -t / 2); e.rotateY(Math.PI / 2);      // 让板厚朝 x（前端面）
    return e;
  });
}

const B = {
  bolt(len = .085, r = .0135){
    const o = new THREE.Group();
    mesh(o, cyl(r * 1.75, r * 1.75, r * 1.6, 6), M.dark, 0, len / 2 - r * .8, 0);
    mesh(o, cyl(r, r, len, 12), M.steel, 0, -len / 2 + r * .8, 0);
    return o;
  },
  nut(r = .015, h = .024){ const o = new THREE.Group(); mesh(o, cyl(r * 1.8, r * 1.8, h, 6), M.steel); return o; },
  washer(r = .02){ const o = new THREE.Group(); mesh(o, cyl(r, r, .006, 20), M.chrome); return o; },
  spring(coils = 7, r = .05, len = .2, wire = .01){ const o = new THREE.Group(); mesh(o, springGeo(coils, r, len, wire), M.chrome); return o; },

  /** 阶梯轴（轴向 x） */
  shaft(steps){
    const o = new THREE.Group();
    let x = 0;
    const prof = [[0, -.001]];
    steps.forEach(([len, r]) => { prof.push([r, x], [r, x + len]); x += len; });
    prof.push([0, x]);
    const m = mesh(o, lathe(prof, 40), M.chrome); m.rotation.z = -Math.PI / 2;
    return o;
  },
  /** 曲柄：曲柄销 + 曲柄臂 + 配重（轴向 x） */
  crankThrow(pinR = .075, throwR = .3, phase = 0){
    const o = new THREE.Group();
    const arm = -.26;
    for (const dx of [arm - .045, arm + .045]){
      const w = mesh(o, cyl(throwR * .92, throwR * .92, .07, 30), M.steel, dx, throwR * .45, 0);
      w.rotation.z = Math.PI / 2; w.rotation.y = 0;
    }
    const pin = mesh(o, cyl(pinR, pinR, .18, 24), M.chrome); pin.rotation.z = Math.PI / 2; pin.position.set(0, throwR, 0);
    // 配重（扇形）
    const geo = g('CW|' + throwR, () => {
      const s = new THREE.Shape();
      s.absarc(0, 0, throwR * 1.02, -.85, .85, false); s.lineTo(0, 0); s.closePath();
      const hole = new THREE.Path(); hole.absarc(0, 0, .11, 0, Math.PI * 2, true); s.holes.push(hole);
      const e = new THREE.ExtrudeGeometry(s, { depth: .07, bevelEnabled: true, bevelSize: .005, bevelThickness: .005, bevelSegments: 1 });
      e.rotateY(Math.PI / 2); return e;
    });
    for (const dx of [arm - .045, arm + .045]){
      const cw = mesh(o, geo, M.steel, dx, 0, 0);
      cw.rotation.x = Math.PI * 1.85;      // 配重朝曲柄销反向
    }
    o.rotation.x = phase;
    return o;
  },
  gear(teeth, r, thick = .05, bore = .04){
    const o = new THREE.Group();
    mesh(o, gearGeo(teeth, r * .87, r, thick, bore), M.titanium);
    mesh(o, cyl(bore * 1.6, bore * 1.6, thick * 1.2, 16), M.dark);
    mesh(o, cyl(r * .62, r * .62, thick * .5, 30), M.steel);
    for (let i = 0; i < 5; i++){
      const a = i / 5 * Math.PI * 2;
      const h = mesh(o, cyl(r * .1, r * .1, thick * 1.4, 10), M.graphite, Math.cos(a) * r * .4, Math.sin(a) * r * .4, 0);
      h.rotation.x = Math.PI / 2;
    }
    return o;
  },
  /** 活塞（轴向 y = 缸孔方向；环槽 + 销座） */
  piston(r = .235, h = .3){
    const o = new THREE.Group();
    mesh(o, lathe([[0, 0], [r * .9, 0], [r, .018], [r, .06], [r * .995, h * .58], [r * .965, h], [0, h]], 46), M.polish);
    for (let i = 0; i < 3; i++) mesh(o, torus(r * .93, .011, 6), M.dark, 0, h - .03 - i * .032, 0).rotation.x = Math.PI / 2;
    const pin = mesh(o, cyl(.062, .062, r * 1.55, 20), M.steel); pin.rotation.z = Math.PI / 2; pin.position.y = h * .38;
    for (const s of [-1, 1]) mesh(o, box(.07, .1, .05), M.polish, 0, h * .38, s * (r - .03));
    return o;
  },
  /** 连杆（局部 +y 朝活塞，-y 为侧端） */
  rod(len = .68, w = .09){
    const o = new THREE.Group();
    mesh(o, cyl(.062, .062, .1, 22), M.polish, 0, len / 2 - .05, 0).rotation.z = Math.PI / 2;
    mesh(o, box(w, len * .8, w * .34), M.alu);

    for (const s of [-1, 1]) mesh(o, cyl(.016, .016, .16, 8), M.dark, 0, -len / 2 - .03, s * .052).rotation.x = s > 0 ? .35 : -.35;

  /** 气门 + 弹簧 + 弹簧座（缸盖上的配气机构小件） */
  valveTrain(springR = .052, springLen = .2){

  rockerArm(){

  pushrod(len = .62){
    const o = new THREE.Group();

    for (const y of [-len / 2 + .015, len / 2 - .015]) mesh(o, cyl(.026, .026, .03, 16), M.steel, 0, y, 0);

  bearing(r = .12, w = .06, balls = 10, ballR = .018){
    const o = new THREE.Group();
    for (const rr of [r * .78, r]){ const t = mesh(o, torus(rr, w * .22, 8), M.steel); t.rotation.x = Math.PI / 2; }

  ring(r = .3, tube = .022){
    const o = new THREE.Group(); const t = mesh(o, torus(r, tube), M.chrome); t.rotation.x = Math.PI / 2; return o;
  },
  sealRing(r = .26){
    const o = new THREE.Group(); const t = mesh(o, torus(r, .014, 8), M.graphite); t.rotation.x = Math.PI / 2; return o;
  },
  snapRing(r = .3){
    const o = new THREE.Group();
    const t = mesh(o, torus(r, .014, 8, Math.PI * 1.85), M.chrome); t.rotation.x = Math.PI / 2;
    mesh(o, box(.045, .045, .02), M.chrome, r * Math.cos(1.9), 0, r * Math.sin(1.9)).rotation.x = Math.PI / 2;

  domeCover(r = .3, h = .22){
    const o = new THREE.Group();

  can(r = .16, h = .34, fins = 4){
    const o = new THREE.Group();

    m.rotation.z = -Math.PI / 2;

      const t = mesh(o, torus(r * .96, .012, 6), M.steel, h * .82 * i / (fins + 1) + h * .09, 0, 0);

  clamp(r = .06){
    const o = new THREE.Group();
    const t = mesh(o, torus(r, .013, 8, Math.PI * 1.5), M.steel); t.rotation.x = Math.PI / 2;

  parts.push({ o, base: o.position.clone(), dir: new THREE.Vector3(dir[0], dir[1], dir[2]).normalize(), dist: dist * Q.explode, delay, tag });

// Keep each moving part separate, batch its fixed surfaces by material.
for(const {o,tag} of parts){
  if(['frontCover','belt','damper'].includes(tag)) o.scale.setScalar(1.35);
  if(tag==='turbo') o.scale.setScalar(1.5);
  if(!o.isGroup) continue;
  o.updateMatrixWorld(true);
  const inverse=o.matrixWorld.clone().invert(), batches=new Map();
  o.traverse(child=>{
    if(!child.isMesh) return;
    const geometry=(child.geometry.index ? child.geometry.toNonIndexed() : child.geometry.clone()).applyMatrix4(new THREE.Matrix4().multiplyMatrices(inverse,child.matrixWorld));
    if(!batches.has(child.material)) batches.set(child.material,[]);
    batches.get(child.material).push(geometry);
  });
  o.clear();
  for(const [material,geometries] of batches){
    const geometry=mergeGeometries(geometries);
    mesh(o,geometry,material);
    for(const source of geometries) source.dispose();
  }
}

/* ══════════════ 5. 紧固件云（InstancedMesh） ══════════════ */
const rnd = (() => { let s = 20261110; return () => (s = s * 16807 % 2147483647, (s - 1) / 2147483646); })();
const sets = [];
function cloud(geometry, material, defs){
  if (!defs.length) return;
  const m = new THREE.InstancedMesh(geometry, material, defs.length);
  m.castShadow = Q.shadow; m.frustumCulled = false;
  const d = new THREE.Object3D(), base = [], dirs = [], dists = [], delays = [];
  defs.forEach(p => {
    d.position.set(p.p[0], p.p[1], p.p[2]);
    d.quaternion.setFromEuler(new THREE.Euler(p.r[0], p.r[1], p.r[2]));
    d.scale.setScalar(p.s || 1); d.updateMatrix();
    base.push({ p: new THREE.Vector3(...p.p), q: d.quaternion.clone(), s: d.scale.x });
    dirs.push(new THREE.Vector3(...p.d).normalize()); dists.push(p.dist * Q.explode); delays.push(p.delay);
  });
  sets.push({ m, base, dirs, dists, delays, count: defs.length });
  assembly.add(m);
}
const boltGeo = g('boltM', () => mergeGeometries([
  (() => { const a = new THREE.CylinderGeometry(.03, .03, .026, 6); a.translate(0, .062, 0); return a; })(),
  (() => { const b = new THREE.CylinderGeometry(.017, .017, .105, 10); b.translate(0, .006, 0); return b; })(),
]));
const nutGeo = g('nutM', () => new THREE.CylinderGeometry(.032, .032, .028, 6));
const washerGeo = g('washM', () => new THREE.CylinderGeometry(.038, .038, .008, 18));
const ballGeo = g('ballM', () => new THREE.SphereGeometry(.018, 12, 8));
const springM = g('springM', () => springGeo(6, .036, .13, .009));

const boltD = [], nutD = [], washD = [], ballD = [], springD = [];
const push = (arr, p, d, dist, delay, rot) => arr.push({ p, r: rot, d, dist, delay, s: .85 + rnd() * .4 });
// 缸盖螺栓（每列 2 排 × 5 颗，沿缸列方向抬起）
for (const s of [1, -1]){
  const n = nvec(s), t = nvec(-s);
  for (const o of [-.22, .22]) for (const x of [-1.5, -.75, 0, .75, 1.5]){
    if (rnd() > Q.fasteners + .25) continue;
    const p = n.clone().multiplyScalar(.94).add(t.clone().multiplyScalar(o)).add(new THREE.Vector3(x + (rnd() - .5) * .1, 0, 0));
    push(boltD, p.toArray(), n.toArray(), 1.25, .3 + rnd() * .05, [0, 0, 0]);
  }
}
// 前盖 / 正时罩螺栓（向前）
for (let i = 0; i < Math.round(10 * Q.fasteners); i++){
  const a = i / 10 * Math.PI * 2, r = .58 + rnd() * .12;
  const p = new THREE.Vector3(1.62 + rnd() * .08, .1 + Math.cos(a) * r, Math.sin(a) * r);
  push(boltD, p.toArray(), [1, -.2, 0], 1.15, .28 + rnd() * .06, [0, 0, Math.PI / 2]);
}
// 油底壳螺栓（向下）
for (let i = 0; i < Math.round(12 * Q.fasteners); i++){
  const x = -1.25 + (i % 6) * .5, z = i < 6 ? -.46 : .46;
  const p = new THREE.Vector3(x + (rnd() - .5) * .08, -.32 - rnd() * .05, z + (rnd() - .5) * .08);
  push(boltD, p.toArray(), [0, -1, 0], 1.0, .26 + rnd() * .05, [0, 0, 0]);
}
// 气门室盖螺栓（每列 5 颗，沿缸列抬起）
for (const s of [1, -1]){
  const n = nvec(s);
  for (let i = 0; i < Math.round(6 * Q.fasteners); i++){
    const x = -1.35 + i * .54;
    const p = n.clone().multiplyScalar(1.62).add(new THREE.Vector3(x + (rnd() - .5) * .06, 0, 0));
    push(boltD, p.toArray(), n.toArray(), 3.15, .38 + rnd() * .05, [0, 0, 0]);
  }
}
// 涡轮/排气法兰螺栓
for (const s of [1, -1]) for (let i = 0; i < 4; i++){
  const a = (i / 4 + .13) * Math.PI * 2;
  const p = nvec(s).multiplyScalar(1.42).add(new THREE.Vector3(.55 + Math.cos(a) * .2, -.2, 0)).add(nvec(-s).multiplyScalar(-.3));
  p.z += s * (Math.sin(a) * .2);

}
// 上方飘散的碎屑（参考图顶部中央的小件云）

  const p = new THREE.Vector3(-1.6 + rnd() * 3.4, 1.15 + rnd() * .6, Math.sin(a) * r);
  const d = [Math.cos(a) * .5, 1, Math.sin(a) * .5], dist = 1.1 + rnd() * .9, delay = .38 + rnd() * .08;
  const k = rnd();
  if (k < .46)      push(boltD, p.toArray(), d, dist, delay, [(rnd() - .5) * 2, rnd() * 3, Math.PI / 2]);
  else if (k < .68) push(nutD, p.toArray(), d, dist, delay, [0, rnd() * 3, 0]);
  else if (k < .84) push(washD, p.toArray(), d, dist, delay, [Math.PI / 2, 0, rnd() * 3]);
  else if (k < .94) push(ballD, p.toArray(), d, dist, delay, [0, 0, 0]);
  else              push(springD, p.toArray(), d, dist, delay, [(rnd() - .5) * 1.2, rnd() * 3, (rnd() - .5) * 1.2]);
}

/* ══════════════ 6. 爆炸动画 ══════════════ */
const dummy = new THREE.Object3D();
const wave = (t, delay) => smooth(clamp((t - delay) / (1 - delay), 0, 1));
function applyExplode(t, time){
  for (const r of parts){
    const e = wave(t, r.delay);
    const dr = (Q.t === null ? Math.sin(time * .45 + r.delay * 11) * .006 * e : 0);      // 悬浮微漂
    r.o.position.set(r.base.x + r.dir.x * (r.dist * e + dr),
                     r.base.y + r.dir.y * (r.dist * e + dr),
                     r.base.z + r.dir.z * (r.dist * e + dr));
  }
  for (const s of sets){
    for (let i = 0; i < s.count; i++){
      const e = wave(t, s.delays[i]);
      dummy.position.copy(s.base[i].p).addScaledVector(s.dirs[i], s.dists[i] * e);
      dummy.quaternion.copy(s.base[i].q);
      dummy.scale.setScalar(s.base[i].s);
      dummy.updateMatrix();
      s.m.setMatrixAt(i, dummy.matrix);
    }
    s.m.instanceMatrix.needsUpdate = true;
  }
}

/* 时间轴：展开 → 停 → 收拢 → 停（循环） */
const SEG = { out: 5.0, top: 3.4, back: 5.0, bottom: 1.6 };
const TOTAL = SEG.out + SEG.top + SEG.back + SEG.bottom;
function timelineT(sec){
  const s = ((sec % TOTAL) + TOTAL) % TOTAL;
  if (s < SEG.out) return smooth(s / SEG.out);
  if (s < SEG.out + SEG.top) return 1;
  const b = s - SEG.out - SEG.top;
  if (b < SEG.back) return 1 - smooth(b / SEG.back);
  return 0;
}
let cycle = SEG.out, manualT = Q.t;     // 默认从“已展开”的样子开始
let auto = Q.auto, spin = Q.spin, hold = 0;
const clock = new THREE.Clock();

/* ══════════════ 7. 相机取景（长焦 + 3/4 俯视 + 自动量尺寸） ══════════════ */
const VIEW = { az: 2.48, el: 1.32, dist: 20, center: new THREE.Vector3() };   // az 让前端(+x)在画面左侧
const MARGIN = 1.06;
const Y3 = new THREE.Vector3(0, 1, 0);
const BOX = new THREE.Box3(), SPH = new THREE.Sphere(), _b = new THREE.Box3(), _s = new THREE.Sphere(), _v = new THREE.Vector3();
let EXT = { hw: 3, hh: 3, hd: 3 };

const camBasis = () => {
  const eye = new THREE.Vector3().setFromSpherical(new THREE.Spherical(1, VIEW.el, VIEW.az));
  const fwd = eye.negate().normalize();
  const right = new THREE.Vector3().crossVectors(fwd, Y3).normalize();
  return { fwd, right, up: new THREE.Vector3().crossVectors(right, fwd).normalize() };
};

// 按“完全展开”的形态量尺寸：逐件球投影得到真实屏幕占位（包围盒的角大多是空的，会明显高估）
function measure(){
  const now = Q.t !== null ? Q.t : timelineT(cycle);
  applyExplode(1, 0);
  for (const st of sets) st.m.boundingBox = null;      // 实例矩阵变了 → 缓存包围盒作废
  assembly.updateMatrixWorld(true);
  BOX.makeEmpty(); BOX.setFromObject(assembly);
  BOX.getBoundingSphere(SPH);
  const { fwd, right, up } = camBasis();
  let hw = .6, hh = .6, hd = .6;
  assembly.traverse(ch => {
    if (!ch.isMesh) return;
    _b.setFromObject(ch);
    if (_b.isEmpty()) return;
    for(let i=0;i<8;i++){
      _v.set(i&1?_b.max.x:_b.min.x,i&2?_b.max.y:_b.min.y,i&4?_b.max.z:_b.min.z).sub(SPH.center);
      hw=Math.max(hw,Math.abs(_v.dot(right))); hh=Math.max(hh,Math.abs(_v.dot(up))); hd=Math.max(hd,Math.abs(_v.dot(fwd)));
    }
  });
  EXT = { hw, hh, hd };
  applyExplode(now, 0);
}
function fit(reset){
  measure();
  const c = SPH.center;
  const vf = camera.fov * Math.PI / 180;
  const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  VIEW.dist = Math.max(EXT.hh / Math.tan(vf / 2), EXT.hw / Math.tan(hf / 2)) * MARGIN + EXT.hd * .35;
  VIEW.center.copy(c);
  controls.target.copy(c);
  if (Q.debug) window.__fit = { c: c.toArray().map(n => +n.toFixed(2)), hw: +EXT.hw.toFixed(2), hh: +EXT.hh.toFixed(2),
    hd: +EXT.hd.toFixed(2), dist: +VIEW.dist.toFixed(2), min: BOX.min.toArray().map(n => +n.toFixed(2)), max: BOX.max.toArray().map(n => +n.toFixed(2)) };
  if (!reset) {
    const direction = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(direction, VIEW.dist);
    controls.update(); return;
  }
  const sp = new THREE.Spherical(VIEW.dist, VIEW.el, VIEW.az);
  camera.position.setFromSpherical(sp).add(controls.target);
  camera.lookAt(controls.target);
  controls.update();
}

/* ══════════════ 7.5 地面接触阴影（悬浮机件要有"压得住"背景的重量感） ══════════════ */
if (Q.bg !== 'gradient'){
  applyExplode(1,0); assembly.updateMatrixWorld(true);
  const sc = document.createElement('canvas'); sc.width = sc.height = 256;
  const sx = sc.getContext('2d');

  rg.addColorStop(.72, 'rgba(46,57,43,.04)'); rg.addColorStop(1, 'rgba(46,57,43,0)');
  sx.fillStyle = rg; sx.fillRect(0, 0, 256, 256);
  const st = new THREE.CanvasTexture(sc); st.colorSpace = THREE.SRGBColorSpace;

    new THREE.MeshBasicMaterial({ map: st, transparent: true, depthWrite: false }));
  const bb = new THREE.Box3().setFromObject(assembly);
  const sz = Math.max(EXT.hw, 4) * 1.55;

/* ══════════════ 8. 后处理：GTAO + 泛光（失败自动降级） ══════════════ */

      import('three/addons/postprocessing/EffectComposer.js'),

    ]);

      ao.updatePdMaterial({ lumaPhi: 6, depthPhi: 2, normalPhi: 3, radius: 4, radiusExponent: 1, rings: 2, samples: 12 });
      composer.addPass(ao);
    }
    if (Q.bloom){

      // 阈值：白棚背景线性值就是 1.0，必须抬到 1.0 以上才不让整幅背景发糊

}

/* 调试探针（?debug=1 挂在 window：量取景 / 数网格 / 测帧代价） */
if (Q.debug){
  const counts = () => {
    let m = 0, inst = 0, tris = 0;
    scene.traverse(o => {
      const g = o.geometry;
      if (o.isInstancedMesh) inst++;
      else if (o.isMesh) m++;
      if (g && g.attributes && g.attributes.position)
        tris += ((g.index ? g.index.count : g.attributes.position.count) / 3) * (o.isInstancedMesh ? o.count : 1);
    });
    return { meshes: m, instanced: inst, parts: parts.length, tris: Math.round(tris) };
  };
  window.__dbg = {
    THREE, scene, camera, renderer, controls, parts, sets, assembly, pivot, counts,
    // 装配体投影到 NDC 的包围盒 → 占画幅百分比（比截图像素阈值法可靠）
    proj(){
      camera.updateMatrixWorld();
      const b = new THREE.Box3().setFromObject(assembly), v = new THREE.Vector3();
      const lo = [1e9, 1e9], hi = [-1e9, -1e9];
      for (let i = 0; i < 8; i++){
        v.set(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).project(camera);
        lo[0] = Math.min(lo[0], v.x); hi[0] = Math.max(hi[0], v.x);
        lo[1] = Math.min(lo[1], v.y); hi[1] = Math.max(hi[1], v.y);
      }
      return { wPct: +((hi[0] - lo[0]) / 2 * 100).toFixed(1), hPct: +((hi[1] - lo[1]) / 2 * 100).toFixed(1),
               cx: +((lo[0] + hi[0]) / 2).toFixed(2), cy: +((lo[1] + hi[1]) / 2).toFixed(2) };
    },
    // 连打 n 帧测每帧代价（不依赖 rAF，后台标签页也能测）
    bench(n = 30){
      renderer.info.autoReset = false;
      renderer.info.reset();
      const t0 = performance.now();
      for (let i = 0; i < n; i++){ composer ? composer.render() : renderer.render(scene, camera); }
      const ms = (performance.now() - t0) / n;
      return { msPerFrame: +ms.toFixed(2), callsPerFrame: Math.round(renderer.info.render.calls / n), trisPerFrame: Math.round(renderer.info.render.triangles / n) };
    },
    // 读回真实像素算直方图：抠掉背景后看主体的黑白两端与局部对比（替代"截图+视觉模型"）
    metrics(thr = 14){
      composer ? composer.render() : renderer.render(scene, camera);   // 同一同步块内渲染，缓冲仍有效
      const gl = renderer.getContext();
      const W = renderer.domElement.width, H = renderer.domElement.height;
      const buf = new Uint8Array(W * H * 4);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const idx = (x, y) => ((H - 1 - y) * W + x) * 4;                 // readPixels 原点在左下
      const lum = i => (0.2126 * buf[i] + 0.7152 * buf[i + 1] + 0.0722 * buf[i + 2]) | 0;
      const sw = Math.max(2, W >> 5), bg = new Float32Array(H), tmp = [];
      for (let y = 0; y < H; y++){
        tmp.length = 0;
        for (let x = 0; x < sw; x++){ tmp.push(lum(idx(x, y))); tmp.push(lum(idx(W - 1 - x, y))); }
        tmp.sort((a, b) => a - b); bg[y] = tmp[tmp.length >> 1];
      }
      const vals = [], mask = new Uint8Array(W * H); let cov = 0;
      for (let y = 0; y < H; y++){
        const b = bg[y];
        for (let x = 0; x < W; x++){
          const i = idx(x, y), v = lum(i);
          if (Math.abs(v - b) > thr){ mask[y * W + x] = 1; cov++; vals.push(v); }
        }
      }
      vals.sort((a, b) => a - b);
      const n = vals.length, q = p => vals[Math.min(n - 1, (p * n) | 0)];
      let dark = 0, bright = 0, white = 0;
      for (const v of vals){ if (v < 60) dark++; if (v > 200) bright++; if (v > 240) white++; }
      const lap = [];
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){
        if (!mask[y * W + x]) continue;
        const c = lum(idx(x, y));
        lap.push(Math.abs(4 * c - lum(idx(x - 1, y)) - lum(idx(x + 1, y)) - lum(idx(x, y - 1)) - lum(idx(x, y + 1))));
      }
      lap.sort((a, b) => a - b);
      return { px: W + 'x' + H, covPct: +(100 * cov / (W * H)).toFixed(1),
        p5: q(.05), p50: q(.5), p95: q(.95), mean: Math.round(vals.reduce((a, v) => a + v, 0) / n),
        dark60Pct: +(100 * dark / n).toFixed(1), bright200Pct: +(100 * bright / n).toFixed(1), white240Pct: +(100 * white / n).toFixed(2),
        lapMean: +(lap.reduce((a, v) => a + v, 0) / lap.length).toFixed(1),
        lapP50: lap[lap.length >> 1], lapP90: lap[(.9 * lap.length) | 0],
        bgRows: [Math.round(bg[2]), Math.round(bg[H >> 1]), Math.round(bg[H - 3])] };
    },
  };
}

  const v = Math.round(t * 1000);
  if (document.activeElement !== slider && +slider.value !== v) slider.value = v;
  slider.style.setProperty('--p', (t * 100).toFixed(1) + '%');
  const pct = String(Math.round(t * 100));
  if (valueEl.textContent !== pct) valueEl.textContent = pct;
  if (Q.debug){
    frames++;
    if (time - t0 > .5){ fps = Math.round(frames / (time - t0)); frames = 0; t0 = time; }
    dbg.textContent = `t=${t.toFixed(3)}  fps=${fps}  dist=${VIEW.dist.toFixed(1)}  draw=${renderer.info.render.calls}  tri=${(renderer.info.render.triangles / 1000).toFixed(0)}k  ao=${!!composer}  bloom=${!!bloomPass}`;
  }
}
loop();
</script>
</body>
</html>
